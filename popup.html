<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OpenChat Translator</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main class="shell">
    <header class="hero stagger">
      <div class="brand-mark" aria-hidden="true">T</div>
      <div>
        <p class="eyebrow">OPENCHAT TOOLS</p>
        <h1>WhatsApp 翻译</h1>
        <p class="subhead">双向翻译 · 本地设置 · 可审计</p>
      </div>
      <label class="switch" title="启用或停用翻译">
        <input id="enabled" type="checkbox">
        <span class="switch-track"></span>
      </label>
    </header>

    <section class="panel stagger" style="--delay: 40ms">
      <div class="panel-heading"><span>语言对</span><span class="status-dot" id="liveDot"></span></div>
      <div class="pair-grid">
        <label>我的语言<select id="sourceLang"></select></label>
        <label>联系人语言<select id="targetLang"></select></label>
      </div>
      <div class="swap-row"><button class="ghost-button" id="swapLang" type="button" title="交换语言">交换语言</button><span id="cacheStats">缓存 0</span></div>
    </section>

    <section class="panel stagger" style="--delay: 80ms">
      <div class="panel-heading"><span>翻译引擎</span></div>
      <label>服务商<select id="engine"><option value="mymemory">MyMemory · 免费并自动回退</option><option value="google">Google Translate · 非官方接口</option></select></label>
      <div class="notice">请求翻译时，消息文字会发送到选定的翻译服务。</div>
    </section>

    <section class="panel stagger" style="--delay: 120ms">
      <div class="panel-heading"><span>对话行为</span></div>
      <label class="check-row"><input id="autoTranslate" type="checkbox"><span>自动翻译收到的消息</span></label>
      <label class="check-row"><input id="translateOutgoing" type="checkbox"><span>按请求翻译发出的消息</span></label>
      <label class="check-row"><input id="sendAfterTranslate" type="checkbox"><span>Alt + Enter 翻译并发送</span></label>
      <label class="check-row"><input id="showOriginal" type="checkbox"><span>保留原文显示</span></label>
    </section>

    <section class="panel stagger" style="--delay: 160ms">
      <div class="panel-heading"><span>外观</span></div>
      <div class="appearance-grid"><label>翻译颜色<input id="translationColor" type="color"></label><label>字号<input id="fontSize" type="range" min="11" max="18" step="1"><output id="fontSizeValue"></output></label></div>
    </section>

    <footer class="actions stagger" style="--delay: 200ms"><button class="primary-button" id="save" type="button">保存设置</button><button class="ghost-button" id="clearCache" type="button">清空缓存</button></footer>
    <div class="status" id="status" role="status" aria-live="polite"></div>
    <p class="legal">独立开源项目。WhatsApp 是 WhatsApp LLC 的商标。本扩展与 WhatsApp 或 Meta 没有隶属关系。</p>
  </main>
  <script src="popup.js"></script>
</body>
</html>
